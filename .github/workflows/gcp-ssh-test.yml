name: GCP IAP SSH Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/293444534887/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deployer@project-b7883a1e-3510-4a94-981.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: project-b7883a1e-3510-4a94-981

      - name: Generate ephemeral SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keygen -t ed25519 \
            -f "$HOME/.ssh/gcp_deploy" \
            -N ""

      - name: Publish SSH key to OS Login
        run: |
          gcloud compute os-login ssh-keys add \
            --key-file="$HOME/.ssh/gcp_deploy.pub" \
            --ttl=30m

      - name: Get OS Login username
        run: |
          USERNAME="$(gcloud compute os-login describe-profile \
            --format='value(posixAccounts[0].username)')"

          echo "OS_LOGIN_USERNAME=$USERNAME" >> "$GITHUB_ENV"

          echo "OS Login username: $USERNAME"

      - name: Start IAP tunnel
        run: |
          gcloud compute start-iap-tunnel cicd-dev 22 \
            --local-host-port=localhost:2222 \
            --zone=asia-south1-c \
            > /tmp/iap-tunnel.log 2>&1 &

          echo $! > /tmp/iap-tunnel.pid

          sleep 5

          cat /tmp/iap-tunnel.log

      - name: Test SSH through IAP
        run: |
          ssh \
            -i "$HOME/.ssh/gcp_deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -p 2222 \
            "$OS_LOGIN_USERNAME@127.0.0.1" \
            "hostname && echo SSH_SUCCESS"

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/iap-tunnel.pid ]; then
            kill "$(cat /tmp/iap-tunnel.pid)" || true
          fi

          gcloud compute os-login ssh-keys remove \
            --key-file="$HOME/.ssh/gcp_deploy.pub" || true

