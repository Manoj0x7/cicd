name: Deploy DEV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
  WIF_POOL: ${{ vars.GCP_WIF_POOL }}
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  ZONE: ${{ vars.GCP_ZONE }}
  VM_NAME: ${{ vars.GCP_VM_NAME }}

jobs:
  deploy:
    name: Deploy to DEV
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Authenticate to GCP using GitHub OIDC
      # --------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: >-
            projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL }}/providers/${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      # --------------------------------------------------
      # 3. Configure gcloud
      # --------------------------------------------------
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      # --------------------------------------------------
      # 4. Dynamically get OS Login username
      # --------------------------------------------------
      - name: Get OS Login username
        run: |
          set -euo pipefail

          USERNAME="$(gcloud compute os-login describe-profile \
            --format='value(posixAccounts[0].username)')"

          if [ -z "$USERNAME" ]; then
            echo "ERROR: Could not determine OS Login username"
            exit 1
          fi

          echo "OS_LOGIN_USERNAME=$USERNAME" >> "$GITHUB_ENV"
          echo "OS Login username: $USERNAME"

      # --------------------------------------------------
      # 5. Create deployment artifact
      # --------------------------------------------------
      - name: Create deployment archive
        run: |
          set -euo pipefail

          RELEASE="${GITHUB_SHA::7}"

          echo "Release: ${RELEASE}"

          tar \
            --exclude='.git' \
            --exclude='.github' \
            -czf "/tmp/site-${RELEASE}.tar.gz" \
            .

          echo "Archive created:"
          ls -lh "/tmp/site-${RELEASE}.tar.gz"

          echo "RELEASE=${RELEASE}" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 6. Generate temporary SSH key
      # --------------------------------------------------
      - name: Generate ephemeral SSH key
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"

          ssh-keygen \
            -t ed25519 \
            -f "$HOME/.ssh/gcp_deploy" \
            -N ""

          chmod 600 "$HOME/.ssh/gcp_deploy"

      # --------------------------------------------------
      # 7. Publish SSH key to OS Login
      # --------------------------------------------------
      - name: Publish SSH key to OS Login
        run: |
          set -euo pipefail

          gcloud compute os-login ssh-keys add \
            --key-file="$HOME/.ssh/gcp_deploy.pub" \
            --ttl=30m

      # --------------------------------------------------
      # 8. Start IAP tunnel
      # --------------------------------------------------
      - name: Start IAP tunnel
        run: |
          set -euo pipefail

          gcloud compute start-iap-tunnel \
            "$VM_NAME" \
            22 \
            --local-host-port=localhost:2222 \
            --zone="$ZONE" \
            > /tmp/iap-tunnel.log 2>&1 &

          echo $! > /tmp/iap-tunnel.pid

          echo "Waiting for IAP tunnel..."
          sleep 5

          cat /tmp/iap-tunnel.log

      # --------------------------------------------------
      # 9. Verify SSH connectivity
      # --------------------------------------------------
      - name: Test SSH connection
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/gcp_deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -p 2222 \
            "${OS_LOGIN_USERNAME}@127.0.0.1" \
            "hostname && echo SSH_SUCCESS"

      # --------------------------------------------------
      # 10. Upload artifact
      # --------------------------------------------------
      - name: Upload release
        run: |
          set -euo pipefail

          scp \
            -i "$HOME/.ssh/gcp_deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -P 2222 \
            "/tmp/site-${RELEASE}.tar.gz" \
            "${OS_LOGIN_USERNAME}@127.0.0.1:/tmp/site-${RELEASE}.tar.gz"

      # --------------------------------------------------
      # 11. Run deployment helper on VM
      # --------------------------------------------------
      - name: Deploy release
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/gcp_deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -p 2222 \
            "${OS_LOGIN_USERNAME}@127.0.0.1" \
            "sudo /usr/local/lib/cicd/deploy-site.sh ${RELEASE}"

      # --------------------------------------------------
      # 12. Verify deployment
      # --------------------------------------------------
      - name: Verify deployment
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/gcp_deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -p 2222 \
            "${OS_LOGIN_USERNAME}@127.0.0.1" \
            "echo 'Current release:' && \
             readlink -f /var/www/site/current && \
             echo 'Application response:' && \
             curl -fsS http://127.0.0.1/"

      # --------------------------------------------------
      # 13. Cleanup - always runs
      # --------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          set +e

          echo "Stopping IAP tunnel..."

          if [ -f /tmp/iap-tunnel.pid ]; then
            kill "$(cat /tmp/iap-tunnel.pid)" 2>/dev/null || true
          fi

          echo "Removing ephemeral OS Login SSH key..."

          if [ -f "$HOME/.ssh/gcp_deploy.pub" ]; then
            gcloud compute os-login ssh-keys remove \
              --key-file="$HOME/.ssh/gcp_deploy.pub" \
              || true
          fi

          echo "Cleanup complete."
