name: GCP OIDC Authentication Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/293444534887/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deployer@project-b7883a1e-3510-4a94-981.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: project-b7883a1e-3510-4a94-981

      - name: Verify authentication
        run: |
          gcloud auth list
          gcloud config get-value project
